name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        run: |
          node -e "const m=require('./manifest.json'); if ('v'+m.version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - name: Package plugin
        run: zip zotero-drop-callout-${{ github.ref_name }}.zip main.js manifest.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json "zotero-drop-callout-${GITHUB_REF_NAME}.zip" --generate-notes
