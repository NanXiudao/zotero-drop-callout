name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check main.js
      - run: node -e "const m=require('./manifest.json'),p=require('./package.json'); if(m.version!==p.version) process.exit(1)"
